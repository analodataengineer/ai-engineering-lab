name: Evals

on:
  push:
  pull_request:

jobs:
  local-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:consent -w interfaces/web
      - run: npm run test:lifecycle -w interfaces/web
      - run: npm run test:access -w engines/interview
      - run: npm run test:observability -w services/session-api
      - run: npm run test:observability -w engines/interview
      - run: npm run eval:test
      - run: npm run eval -- --verify-expectations
